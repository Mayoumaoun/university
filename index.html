<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12162a">
<title>Interview Coach</title>
<style>
:root{--bg:#12162a;--bg2:#171c36;--card:#1d2342;--card2:#232a4e;--line:#2c335c;--ink:#f0f2fc;--mute:#97a0c9;--acc:#a9bcff;--acc2:#7e9aff;--ok:#6fd6a4;--warn:#f2b25c;--bad:#f27b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2) 300px);color:var(--ink);font:15.5px/1.5 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
#app{max-width:580px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:12px;font-size:13.5px;color:var(--mute)}
.crumb span{cursor:pointer;padding:3px 7px;border-radius:7px}
.crumb span:hover,.crumb span.on{color:var(--ink);background:var(--card2)}
.crumb i{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 6px 18px -10px rgba(0,0,0,.5)}
button{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 15px;transition:transform .08s}
button:active{transform:scale(.97)}
button.p{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#12162a;font-weight:700;border:0}
button.g{background:none;border:0;color:var(--mute)}
button.danger{background:none;border:0;color:var(--bad)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px}
textarea{min-height:180px}
.mute{color:var(--mute);font-size:13.5px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1024ee;backdrop-filter:blur(10px);padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 4px;font-size:13px;border-radius:10px}
nav .on{color:var(--acc);font-weight:700;background:var(--card2)}
.mic{width:126px;height:126px;border-radius:50%;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#12162a;font-weight:700;display:block;margin:20px auto;border:0;box-shadow:0 10px 26px -10px rgba(126,154,255,.6)}
.mic.rec{background:linear-gradient(135deg,#ff8e8e,var(--bad));animation:pu 1.1s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:9px;background:var(--card);border-color:var(--line)}
.sc{font-family:Georgia,serif;font-size:32px;color:var(--acc)}
.q{border-left:3px solid var(--line);padding-left:11px;margin:11px 0}
ul{padding-left:18px;margin:6px 0}
details summary{color:var(--acc);padding:8px 0;cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;font:13.5px/1.5 system-ui;margin:0}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;border:1px solid var(--line)}.seg button{flex:1;background:none;border:0;padding:9px}.seg .on{background:var(--acc2);color:#12162a;font-weight:700;border-radius:8px}
.icon{background:none;border:0;padding:6px 10px;font-size:19px}
.row2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);background:none;border-radius:0;color:var(--ink)}
.row2:last-child{border-bottom:0}
.row2 b{display:block;font-size:15.5px;font-weight:600}
.row2 .sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.row2 .arrow{color:var(--mute);margin-left:auto}
.folder{font-size:22px}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #454e82;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg)}
.chk.on{background:var(--acc2);border-color:var(--acc2);color:#12162a}
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sd{aspect-ratio:1;border-radius:6px;background:var(--card2)}
.sd.on{background:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.pill{display:inline-block;background:var(--card2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mute);margin-right:6px}
.upl{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:8px}
.gdiv{margin-bottom:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gdiv>summary{padding:12px 14px;background:var(--card);display:flex;align-items:center;gap:10px}
.gdiv .inner{padding:0 10px 8px}
</style></head><body>
<div id="app"></div>
<nav><button id="n1" onclick="go('lib')">Library</button><button id="n2" onclick="go('pick')">Interview</button><button id="n3" onclick="go('hist')">History</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const natCmp=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LANGS={auto:'Auto (match the material)',en:'English',fr:'French',es:'Spanish',de:'German',ar:'Arabic'};

function migrate(o){
 if(!o)return{v:3,key:'',style:'strict',lang:'auto',posts:[],sessions:[]};
 if(o.v==3)return o;
 if(o.v==2){
  const posts=(o.posts||[]).map(p=>({id:p.id,title:p.title,text:p.text||'',url:p.url||'',space:p.cat||'',cat:p.sub||'',sub:'',ts:p.ts||Date.now()}));
  const sessions=(o.sessions||[]).map(s=>({id:s.id||uid(),ts:s.ts,style:s.style||'strict',lang:'auto',
   posts:(s.posts||[]).map(p=>({id:p.id,title:p.title,space:p.cat||'',cat:p.sub||'',sub:'',text:p.text||''})),
   log:s.log||[],analysis:s.analysis||{}}));
  return{v:3,key:o.key||'',style:o.style||'strict',lang:'auto',posts,sessions}}
 if(o.posts&&!Array.isArray(o.posts)){
  const posts=[],idMap={};
  Object.keys(o.posts).forEach(k=>{const p=o.posts[k];const id='p'+k,wk=Math.ceil(k/7);
   posts.push({id,title:p.title||('Day '+k),text:p.text||'',url:p.url||'',space:'AI 16-week series',cat:'Week '+wk,sub:'',ts:Number(k)});
   idMap[k]=id});
  const sessions=(o.sessions||[]).map(s=>({id:s.id||uid(),ts:s.ts,style:s.style||'strict',lang:'auto',
   posts:(s.posts||[]).map(p=>({id:idMap[p.n]||('p'+p.n),title:p.title||('Day '+p.n),space:'AI 16-week series',cat:'Week '+Math.ceil((p.n||1)/7),sub:'',text:p.text||''})),
   log:s.log||[],analysis:s.analysis||{}}));
  return{v:3,key:o.key||'',style:o.style||'strict',lang:'auto',posts,sessions}}
 return{v:3,key:o.key||'',style:o.style||'strict',lang:o.lang||'auto',posts:[],sessions:[]}}

let S=migrate(JSON.parse(localStorage.getItem('ai16')||'null'));
const save=()=>localStorage.setItem('ai16',JSON.stringify(S));
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
let I=null,sel=new Set(),editing=null,crumb=[],q='';

function go(v,a){if(I&&I.rec){try{I.rec.stop()}catch{}}I=null;
 $('#n1').className=v=='lib'||v=='post'?'on':'';$('#n2').className=v=='pick'||v=='live'?'on':'';$('#n3').className=v=='hist'||v=='det'?'on':'';
 ({lib,post,pick,live:()=>{},set,hist,det})[v](a)}
const app=h=>$('#app').innerHTML=h;
const FIELD=['space','cat','sub'];
function distinctAt(idx,filters){const s=new Set();S.posts.forEach(p=>{for(let i=0;i<filters.length;i++)if((p[FIELD[i]]||'')!==(filters[i]||''))return;s.add(p[FIELD[idx]]||'')});return[...s].sort(natCmp)}
function postsAt(filters){return S.posts.filter(p=>filters.every((f,i)=>(p[FIELD[i]]||'')===(f||'')))}
function countUnder(filters){return postsAt(filters).length}

/* ---------- Library (drill-down) ---------- */
function lib(){
 const days=[];for(let i=34;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toDateString())}
 const done=new Set(S.sessions.map(s=>new Date(s.ts).toDateString()));
 let streakN=0;for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);if(done.has(d.toDateString()))streakN++;else break}
 const strip=days.map(d=>`<div class="sd ${done.has(d)?'on':''}"></div>`).join('');
 const head=`<div class="top"><h1>Library</h1><button class="icon" onclick="go('set')">⚙</button></div>
  <div class="card"><p class="mute" style="margin:0 0 8px">${streakN?`🔥 ${streakN}-day interview streak`:'No interview streak yet'} · last 35 days</p><div class="streak">${strip}</div></div>
  <div class="card"><input placeholder="Search all posts by title" value="${esc(q)}" oninput="q=this.value;lib()"></div>`;
 if(q.trim()){
  const m=S.posts.filter(p=>p.title.toLowerCase().includes(q.trim().toLowerCase()));
  app(head+(m.length?m.map(p=>`<div class="card" style="padding:0"><button class="row2" style="width:100%" onclick="go('post','${p.id}')"><span class="folder">📄</span><span><b>${esc(p.title)}</b><span class="sub">${[p.space,p.cat,p.sub].filter(Boolean).join(' / ')||'Unsorted'}</span></span><span class="arrow">›</span></button></div>`).join(''):'<p class="empty">No matches.</p>'));
  return}
 const crumbHtml=`<div class="crumb"><span class="${crumb.length==0?'on':''}" onclick="crumb=[];lib()">Library</span>`+crumb.map((c,i)=>`<i>›</i><span class="${i==crumb.length-1?'on':''}" onclick="crumb=crumb.slice(0,${i+1});lib()">${esc(c||'Unsorted')}</span>`).join('')+`</div>`;
 let body;
 if(crumb.length<3){
  const idx=crumb.length,opts=distinctAt(idx,crumb);
  body=opts.length?opts.map(v=>`<div class="card" style="padding:0"><button class="row2" style="width:100%" onclick="crumb=[...crumb,'${esc(v).replace(/'/g,"\\'")}'];lib()"><span class="folder">📁</span><span><b>${esc(v||'Unsorted')}</b><span class="sub">${countUnder([...crumb,v])} post${countUnder([...crumb,v])==1?'':'s'}</span></span><span class="arrow">›</span></button></div>`).join(''):`<p class="empty">Nothing here yet.</p>`;
 }else{
  const ps=postsAt(crumb);
  body=ps.length?ps.map(p=>`<div class="card" style="padding:0"><button class="row2" style="width:100%" onclick="go('post','${p.id}')"><span class="folder">📄</span><span><b>${esc(p.title)}</b><span class="sub">${esc((p.text||'').slice(0,60))}${p.text&&p.text.length>60?'…':''}</span></span><span class="arrow">›</span></button></div>`).join(''):`<p class="empty">No posts in this folder yet.</p>`;
 }
 app(head+crumbHtml+`<button class="p" style="width:100%;margin-bottom:12px" onclick="go('post')">+ Add a post here</button>`+body)}

/* ---------- Post add/edit ---------- */
function post(id){
 editing=id||null;
 const p=id?S.posts.find(x=>x.id==id):{space:crumb[0]||'',cat:crumb[1]||'',sub:crumb[2]||''};
 const spaces=[...new Set(S.posts.map(x=>x.space).filter(Boolean))].sort(natCmp);
 const cats=[...new Set(S.posts.filter(x=>x.space==(p.space||'')).map(x=>x.cat).filter(Boolean))].sort(natCmp);
 const subs=[...new Set(S.posts.filter(x=>x.space==(p.space||'')&&x.cat==(p.cat||'')).map(x=>x.sub).filter(Boolean))].sort(natCmp);
 app(`<div class="top"><h2>${id?'Edit post':'Add post'}</h2><button class="g" onclick="go('lib')">Back</button></div>
 <div class="card">
 <input id="pt" placeholder="Title" value="${esc(p.title||'')}" style="margin-bottom:8px">
 <div class="row" style="margin-bottom:8px">
 <input id="psp" list="spl" placeholder="Folder, e.g. University" value="${esc(p.space||'')}">
 <input id="pc" list="cl" placeholder="Category, e.g. Machine Learning" value="${esc(p.cat||'')}">
 </div>
 <input id="ps" list="sl" placeholder="Sub-category, e.g. Week 5 (optional)" value="${esc(p.sub||'')}" style="margin-bottom:8px">
 <datalist id="spl">${spaces.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
 <datalist id="sl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
 <div class="upl"><input type="file" id="pf" accept=".txt,.md,.pdf,.docx" onchange="onFile(this)" style="border:0;padding:0"><p class="mute" style="margin:6px 0 0">Upload a .txt, .md, .pdf or .docx file, or paste below</p></div>
 <textarea id="px" placeholder="Paste the post link or the full text">${esc(p.text||p.url||'')}</textarea>
 <p class="mute" id="pm">A link is fetched through a free reader. If it fails, paste the text or upload a file instead.</p>
 <div class="row"><button class="p" onclick="savePost()">Save</button>${id?'<button class="danger" onclick="delPost()">Delete</button>':''}</div></div>`)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function pdfText(buf){
 await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js');
 const lib=window['pdfjs-dist/build/pdf'];lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
 const pdf=await lib.getDocument({data:buf}).promise;let t='';
 for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();t+=c.items.map(it=>it.str).join(' ')+'\n\n'}
 return t.trim()}
async function docxText(buf){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js');return(await window.mammoth.extractRawText({arrayBuffer:buf})).value.trim()}
async function onFile(inp){
 const f=inp.files[0];if(!f)return;
 $('#pm').textContent='Reading file...';$('#pm').style.color='';
 try{const ext=f.name.split('.').pop().toLowerCase();let t;
  if(ext=='pdf')t=await pdfText(await f.arrayBuffer());
  else if(ext=='docx')t=await docxText(await f.arrayBuffer());
  else t=await f.text();
  $('#px').value=t;if(!$('#pt').value.trim())$('#pt').value=f.name.replace(/\.[^.]+$/,'');
  $('#pm').textContent=`Loaded ${f.name} (${t.length} characters). Review and save.`}
 catch(e){$('#pm').textContent='Could not read that file: '+e.message.slice(0,100);$('#pm').style.color='var(--bad)'}}
async function savePost(){
 let v=$('#px').value.trim(),t=$('#pt').value.trim(),sp=$('#psp').value.trim(),cat=$('#pc').value.trim(),sub=$('#ps').value.trim(),url='';
 if(!v||!t){$('#pm').textContent='Title and content are both needed.';$('#pm').style.color='var(--bad)';return}
 if(/^https?:\/\/\S+$/.test(v)){url=v;$('#pm').textContent='Fetching the post...';$('#pm').style.color='';
  try{const r=await fetch('https://r.jina.ai/'+v);if(!r.ok)throw 0;const x=await r.text();
   v=x.includes('Markdown Content:')?x.split('Markdown Content:')[1].trim():x;
   if(v.length<300)throw 0}
  catch{$('#pm').textContent='Could not fetch that link. Paste the text or upload a file instead.';$('#pm').style.color='var(--bad)';return}}
 if(editing){const p=S.posts.find(x=>x.id==editing);Object.assign(p,{title:t,text:v,url,space:sp,cat,sub})}
 else S.posts.push({id:uid(),title:t,text:v,url,space:sp,cat,sub,ts:Date.now()});
 save();crumb=[sp,cat,sub].filter((x,i,a)=>x||i<a.length);go('lib')}
function delPost(){if(!confirm('Delete this post? Past interviews that used it keep their own copy of the text.'))return;S.posts=S.posts.filter(x=>x.id!=editing);save();go('lib')}

/* ---------- Settings ---------- */
function set(){
 app(`<div class="top"><h2>Settings</h2><button class="g" onclick="go('lib')">Back</button></div>
 <div class="card"><p class="mute">Free Groq API key from console.groq.com. Stored only on this phone.</p>
 <input id="k" type="password" placeholder="gsk_..." value="${esc(S.key)}"><br><br><button class="p" onclick="S.key=$('#k').value.trim();save();go('lib')">Save key</button></div>
 <div class="card"><p class="mute">Backup your library and history.</p><div class="row">
 <button onclick="exp()">Export</button><button onclick="$('#f').click()">Import</button></div>
 <input id="f" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>`)}
function exp(){const{key,...d}=S;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='interview-coach-backup.json';a.click()}
async function imp(f){try{const d=JSON.parse(await f.text());if(d.v!=3)throw 0;S={...S,...d,key:S.key};save();go('lib')}catch{alert('That file could not be read.')}}

/* ---------- Groq ---------- */
async function groq(path,o){const r=await fetch('https://api.groq.com/openai/v1/'+path,{...o,headers:{Authorization:'Bearer '+S.key,...(o.headers||{})}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));return r}
async function chat(messages,json){let err;for(const m of ['openai/gpt-oss-120b','openai/gpt-oss-20b']){try{const r=await groq('chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:m,messages,temperature:.6,...(json?{response_format:{type:'json_object'}}:{})})});return(await r.json()).choices[0].message.content}catch(e){err=e}}throw err}
async function stt(blob){const f=new FormData();f.append('file',blob,'a.'+(blob.type.includes('mp4')?'m4a':'webm'));f.append('model','whisper-large-v3-turbo');return(await(await groq('audio/transcriptions',{method:'POST',body:f})).json()).text.trim()}

/* ---------- Pick posts for an interview ---------- */
function groupTree(list){const t={};list.forEach(p=>{const sp=p.space||'Unsorted',ct=p.cat||'General',sb=p.sub||'';t[sp]=t[sp]||{};t[sp][ct]=t[sp][ct]||{};t[sp][ct][sb]=t[sp][ct][sb]||[];t[sp][ct][sb].push(p)});return t}
function pick(){
 if(!S.posts.length){app(`<div class="top"><h1>New interview</h1></div><p class="empty">Add posts in the Library first.</p>`);return}
 const tree=groupTree(S.posts);
 const state=ids=>{const on=ids.filter(i=>sel.has(i)).length;return on==0?'':on==ids.length?'on':'~'};
 const box=ids=>{const s=state(ids);return `<span class="chk ${s=='on'?'on':''}">${s=='on'?'✓':s=='~'?'–':''}</span>`};
 let html='';
 for(const sp of Object.keys(tree).sort(natCmp)){
  const spIds=Object.values(tree[sp]).flatMap(o=>Object.values(o).flat()).map(p=>p.id);
  html+=`<details class="gdiv"><summary onclick="event.preventDefault();toggleGroup([${spIds.map(i=>`'${i}'`).join(',')}])" style="cursor:pointer"><span onclick="event.stopPropagation()"></span>${box(spIds)} 📁 ${esc(sp)}</summary><div class="inner">`;
  for(const ct of Object.keys(tree[sp]).sort(natCmp)){
   const ctIds=Object.values(tree[sp][ct]).flat().map(p=>p.id);
   html+=`<details open class="gdiv" style="margin-left:6px"><summary onclick="event.preventDefault();toggleGroup([${ctIds.map(i=>`'${i}'`).join(',')}])" style="cursor:pointer;font-size:14px">${box(ctIds)} ${esc(ct)}</summary><div class="inner">`;
   for(const sb of Object.keys(tree[sp][ct]).sort(natCmp)){
    if(sb)html+=`<p class="mute" style="margin:6px 0 2px 8px">${esc(sb)}</p>`;
    for(const p of tree[sp][ct][sb]){
     html+=`<button class="row2" onclick="toggleOne('${p.id}')"><span class="chk ${sel.has(p.id)?'on':''}">${sel.has(p.id)?'✓':''}</span><b style="font-weight:500;font-size:14.5px">${esc(p.title)}</b></button>`}}
   html+=`</div></details>`}
  html+=`</div></details>`}
 app(`<div class="top"><h1>New interview</h1></div>
 <div class="card"><div class="row" style="margin-bottom:10px"><div class="seg"><button class="${S.style=='strict'?'on':''}" onclick="S.style='strict';save();pick()">Strict</button><button class="${S.style=='friendly'?'on':''}" onclick="S.style='friendly';save();pick()">Friendly</button></div></div>
 <label class="mute">Interview language</label>
 <select onchange="S.lang=this.value;save()">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${S.lang==k?'selected':''}>${v}</option>`).join('')}</select></div>
 <button class="p" style="width:100%;margin-bottom:12px" ${sel.size?'':'disabled'} onclick="startPicked()">Start interview (${sel.size} selected)</button>
 ${html}`)}
function toggleOne(id){sel.has(id)?sel.delete(id):sel.add(id);pick()}
function toggleGroup(ids){const allOn=ids.every(i=>sel.has(i));ids.forEach(i=>allOn?sel.delete(i):sel.add(i));pick()}
function startPicked(){const ids=[...sel];sel=new Set();start(ids)}

/* ---------- Interview ---------- */
function start(ids){
 if(!S.key){alert('Add your Groq API key in Settings first.');return go('set')}
 const posts=ids.map(id=>S.posts.find(p=>p.id==id)).filter(Boolean);
 if(!posts.length)return;
 const cap=posts.length<=2?6000:posts.length<=5?2500:1200;
 const use=posts.map(p=>({id:p.id,title:p.title,space:p.space,cat:p.cat,sub:p.sub,text:(p.text||'').slice(0,cap)}));
 const mat=use.map(p=>`### ${p.title}${p.space||p.cat?` — ${[p.space,p.cat,p.sub].filter(Boolean).join(' / ')}`:''}\n${p.text}`).join('\n\n');
 const langLine=S.lang=='auto'?'Use the same language as the MATERIAL below for everything you say — questions, feedback, and the closing line.':`Conduct the entire interview — every question, every piece of feedback, and the closing line — in ${LANGS[S.lang]}, regardless of the language the MATERIAL is written in.`;
 I={style:S.style,lang:S.lang,posts:use,log:[],ans:0,busy:false,
  msgs:[{role:'system',content:`${S.style=='strict'?'You are a strict senior interviewer at a top company: terse, technical, no praise, you push for precision and trade-offs.':'You are a warm, conversational interviewer: encouraging and casual, but still honest.'}\n${langLine}\nYou are running a text interview testing the candidate's understanding of the MATERIAL below (it may span several topics or time periods). You decide, based on how much ground has genuinely been covered and how the candidate is doing, how many questions the interview needs — there is no fixed number. Typically that is somewhere between 4 and 10 questions, but use your judgement: cover the material's key ideas, mix conceptual, intuitive and applied angles, don't just interview on the first item if several were given, and don't ask more questions than the material and the candidate's answers justify. Never repeat a question already asked.\n\nAfter the candidate's first answer, and every answer after that, give real, specific feedback before moving on: say plainly what was correct, clearly correct any inaccuracy or misconception, and fill in anything important they left out, referencing the material. Do not be vague or only encouraging — the point is for the candidate to actually learn from mistakes.\n\nRespond ONLY with JSON, no markdown fences: {"feedback": string|null (null only on your very first message, before any answer exists), "question": string|null (the next question; null only when done is true), "done": boolean (true once the interview should end), "closing": string|null (a short closing line, only when done is true)}\n\nMATERIAL:\n${mat}`},{role:'user',content:'Begin the interview.'}]};
 $('#n1').className='';$('#n2').className='on';$('#n3').className='';
 liveUi();ask()}
function liveUi(){
 app(`<div class="top"><h2>Interview</h2><button class="g" onclick="if(confirm('Leave without saving?'))go('pick')">Quit</button></div>
 <div class="card"><p class="mute" style="margin:0">${I.posts.length} post${I.posts.length>1?'s':''}: ${esc(I.posts.map(p=>p.title).join(', '))}</p>
 <p class="mute" style="margin:2px 0 0">${I.style=='strict'?'Strict':'Friendly'} · ${LANGS[I.lang]}</p></div>
 <div id="feed"></div>
 <div class="card" style="text-align:center"><p id="st" class="mute" style="margin:0 0 10px"></p>
 <button id="mic" class="mic" onclick="mic()" disabled>Answer</button>
 <button onclick="finish()">End &amp; grade now</button></div>`);
 renderFeed()}
function renderFeed(){
 const e=$('#feed');if(!e)return;
 e.innerHTML=I.log.map(x=>x.role=='q'?`<div class="card"><b>Question ${x.n}</b><p style="margin:6px 0 0">${esc(x.text)}</p></div>`
  :x.role=='me'?`<div class="card" style="background:var(--card2)"><p class="mute" style="margin:0 0 4px">You said</p><p style="margin:0">${esc(x.text)}</p></div>`
  :`<div class="card" style="border-left:3px solid var(--acc)"><p class="mute" style="margin:0 0 4px">Feedback</p><p style="margin:0">${esc(x.text)}</p></div>`).join('')}
const st=t=>{const e=$('#st');if(e)e.textContent=t};
async function ask(){
 try{st('Interviewer is thinking...');I.busy=true;$('#mic').disabled=true;
  const raw=await chat(I.msgs,true);
  let j;try{j=JSON.parse(raw.replace(/```json|```/g,'').trim())}catch{j={feedback:null,question:raw.replace(/```json|```/g,'').trim(),done:false,closing:null}}
  I.msgs.push({role:'assistant',content:[j.feedback,j.question||j.closing].filter(Boolean).join('\n\n')});
  if(j.feedback)I.log.push({role:'fb',text:j.feedback});
  if(j.done){if(j.closing)I.log.push({role:'fb',text:j.closing});renderFeed();finish();return}
  I.ans++;I.log.push({role:'q',n:I.ans,text:j.question});renderFeed();
  I.busy=false;$('#mic').disabled=false;st('Your turn: tap to answer')}
 catch(e){st('Error: '+e.message.slice(0,140));I.busy=false}}
async function mic(){
 if(I.busy)return;const b=$('#mic');
 if(I.rec){I.rec.stop();I.rec=null;return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(s);I.ch=[];
  mr.ondataavailable=e=>I.ch.push(e.data);
  mr.onstop=()=>{s.getTracks().forEach(t=>t.stop());b.classList.remove('rec');b.textContent='Answer';answered(new Blob(I.ch,{type:mr.mimeType}))};
  mr.start();I.rec=mr;b.classList.add('rec');b.textContent='Stop';st('Recording...')}
 catch{alert('Microphone blocked. Allow it in your browser settings for this site.')}}
async function answered(blob){
 I.busy=true;$('#mic').disabled=true;st('Transcribing...');
 try{const t=await stt(blob);
  if(!t){st("Didn't catch that. Tap to try again");I.busy=false;$('#mic').disabled=false;return}
  I.log.push({role:'me',text:t});renderFeed();
  I.msgs.push({role:'user',content:t});
  await ask()}
 catch(e){st('Error: '+e.message.slice(0,140));I.busy=false;$('#mic').disabled=false}}
async function finish(){
 if(!I||I.fin)return;if(I.rec){I.rec.onstop=null;I.rec.stop();I.rec=null}
 if(!I.log.some(x=>x.role=='me')){go('pick');return}
 I.fin=true;st('Grading your interview...');$('#mic').disabled=true;
 const tr=I.log.map(x=>(x.role=='q'?'Interviewer: ':x.role=='me'?'Candidate: ':'Interviewer feedback: ')+x.text).join('\n');
 const mat=I.posts.map(p=>`${p.title}${p.space||p.cat?` — ${[p.space,p.cat,p.sub].filter(Boolean).join(' / ')}`:''}\n${p.text.slice(0,2500)}`).join('\n\n');
 const langLine=I.lang=='auto'?'Write your JSON field values in the same language as the MATERIAL.':`Write your JSON field values (verdict, strengths, gaps, said, better, study) in ${LANGS[I.lang]}.`;
 try{
  const raw=await chat([{role:'system',content:`You grade interview practice. Return ONLY JSON: {"score":0-10 number,"verdict":"2 sentence summary","strengths":[strings],"gaps":[strings],"questions":[{"q":"","said":"short summary of the answer","better":"a stronger model answer","rating":"good|ok|weak"}],"study":[strings]}. Judge the answers against the material and general correctness. Be honest and specific. ${langLine}`},{role:'user',content:`MATERIAL:\n${mat}\n\nTRANSCRIPT:\n${tr}`}],true);
  const an=JSON.parse(raw.replace(/```json|```/g,'').trim());
  const s={id:uid(),ts:Date.now(),style:I.style,lang:I.lang,posts:I.posts,log:I.log,analysis:an};
  S.sessions.unshift(s);save();I=null;go('det',s.id)}
 catch(e){st('Grading failed: '+e.message.slice(0,120));I.fin=false;$('#mic').disabled=false}}

/* ---------- History ---------- */
function sessLabel(s){
 if(s.posts.length==1)return s.posts[0].title;
 const paths=[...new Set(s.posts.map(p=>[p.space,p.cat,p.sub].filter(Boolean).join(' / ')))];
 if(paths.length==1)return `${s.posts.length} posts · ${paths[0]}`;
 return `${s.posts.length} posts across topics`}
function hist(){
 const l=S.sessions.map(s=>`<button class="li" onclick="go('det','${s.id}')"><span><b>${esc(sessLabel(s))}</b><br><span class="mute">${s.style} · ${LANGS[s.lang||'auto']} · ${fmt(s.ts)}</span></span><span class="sc" style="font-size:22px">${esc(s.analysis.score)}</span></button>`).join('');
 app(`<div class="top"><h1>History</h1></div>${l||'<p class="empty">No interviews yet. Pick some posts from the Interview tab.</p>'}`)}
function det(id){
 const s=S.sessions.find(x=>x.id==id),a=s.analysis,c={good:'--ok',ok:'--warn',weak:'--bad'};
 const L=x=>(x||[]).map(i=>`<li>${esc(i)}</li>`).join('');
 app(`<div class="top"><h2>${esc(sessLabel(s))}</h2><button class="g" onclick="go('hist')">Back</button></div>
 <div class="card"><p class="mute" style="margin:0">${s.style} · ${LANGS[s.lang||'auto']} · done on ${fmt(s.ts)}</p>
 <div class="sc">${esc(a.score)}/10</div><p>${esc(a.verdict)}</p></div>
 <div class="card"><h3>Strengths</h3><ul>${L(a.strengths)}</ul><h3 style="margin-top:12px">Gaps</h3><ul>${L(a.gaps)}</ul><h3 style="margin-top:12px">Study next</h3><ul>${L(a.study)}</ul></div>
 <div class="card"><h3>Question by question</h3>${(a.questions||[]).map(qq=>`<div class="q" style="border-color:var(${c[qq.rating]||'--line'})"><b>${esc(qq.q)}</b><p class="mute" style="margin:4px 0">You: ${esc(qq.said)}</p><p style="margin:0">${esc(qq.better)}</p></div>`).join('')}</div>
 <div class="card"><details><summary>Transcript</summary>${s.log.map(x=>`<p><b>${x.role=='q'?'Interviewer':x.role=='me'?'You':'Feedback'}:</b> ${esc(x.text)}</p>`).join('')}</details>
 <details><summary>Post${s.posts.length>1?'s':''} covered</summary>${s.posts.map(p=>`<h3 style="margin-top:10px">${esc(p.title)}<span class="mute" style="font-family:system-ui;font-weight:400;font-size:12.5px"> — ${esc([p.space,p.cat,p.sub].filter(Boolean).join(' / ')||'Unsorted')}</span></h3><pre>${esc(p.text)}</pre>`).join('')}</details></div>
 <button class="danger" onclick="if(confirm('Delete this interview?')){S.sessions=S.sessions.filter(x=>x.id!='${s.id}');save();go('hist')}">Delete interview</button>`)}
go('lib');
</script></body></html>
